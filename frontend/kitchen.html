<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraDine AI — Kitchen Kanban Display (KDS)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-dark text-white">

    <!-- TOP KITCHEN HEADER -->
    <header class="py-3 px-4 bg-secondary bg-opacity-10 border-bottom border-secondary border-opacity-20 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <span class="p-2 bg-success bg-opacity-20 text-success rounded-3">
                <i data-lucide="chef-hat" class="w-6 h-6"></i>
            </span>
            <div>
                <h4 class="fw-bold text-white m-0">Kitchen Display System (KDS)</h4>
                <div class="text-secondary small">Realtime Kitchen Order Ticket Stream • Branch #1</div>
            </div>
        </div>

        <div class="d-flex align-items-center gap-4">
            <div class="fs-4 fw-extrabold text-success font-monospace" id="kdsClock">12:21 PM</div>
            <button class="btn btn-secondary-saas" onclick="testSoundAlert()"><i data-lucide="bell"></i> Sound Test</button>
            <a href="dashboard.html" class="btn btn-primary-saas"><i data-lucide="layout-dashboard"></i> Back to Dashboard</a>
        </div>
    </header>

    <!-- KANBAN BOARD CONTAINER -->
    <div class="container-fluid p-4">
        <div class="row g-3">
            <!-- COLUMN 1: PENDING -->
            <div class="col-md-3">
                <div class="kanban-col">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold text-warning m-0 uppercase tracking-wider"><i data-lucide="clock" class="d-inline w-4 me-1"></i> PENDING</h6>
                        <span class="badge bg-warning text-dark font-monospace" id="count-pending">0 Orders</span>
                    </div>
                    <div id="col-pending"></div>
                </div>
            </div>

            <!-- COLUMN 2: PREPARING -->
            <div class="col-md-3">
                <div class="kanban-col">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold text-info m-0 uppercase tracking-wider"><i data-lucide="flame" class="d-inline w-4 me-1"></i> PREPARING</h6>
                        <span class="badge bg-info bg-opacity-20 text-info font-monospace" id="count-preparing">0 Orders</span>
                    </div>
                    <div id="col-preparing"></div>
                </div>
            </div>

            <!-- COLUMN 3: READY -->
            <div class="col-md-3">
                <div class="kanban-col">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold text-success m-0 uppercase tracking-wider"><i data-lucide="check-circle-2" class="d-inline w-4 me-1"></i> READY</h6>
                        <span class="badge bg-success bg-opacity-20 text-success font-monospace" id="count-ready">0 Orders</span>
                    </div>
                    <div id="col-ready"></div>
                </div>
            </div>

            <!-- COLUMN 4: COMPLETED / DELIVERED -->
            <div class="col-md-3">
                <div class="kanban-col">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold text-secondary m-0 uppercase tracking-wider"><i data-lucide="package-check" class="d-inline w-4 me-1"></i> COMPLETED</h6>
                        <span class="badge bg-secondary font-monospace" id="count-delivered">0 Orders</span>
                    </div>
                    <div id="col-delivered"></div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/kitchen.js"></script>
    <script>
        lucide.createIcons();
        
        setInterval(() => {
            const clock = document.getElementById('kdsClock');
            if (clock) clock.innerText = new Date().toLocaleTimeString();
        }, 1000);
    </script>
</body>
</html>
