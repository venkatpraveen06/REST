<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraDine AI — Executive Admin Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-body);
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(200, 155, 60, 0.3);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(200, 155, 60, 0.15);
            padding: 2.5rem;
        }
        .demo-credential-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px dashed rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .demo-credential-box:hover {
            background: rgba(16, 185, 129, 0.18);
            border-color: #10b981;
        }
    </style>
</head>
<body>

    <div class="login-card text-white">
        <!-- BRAND HEADER -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center p-3 bg-warning bg-opacity-20 text-warning rounded-4 mb-3 border border-warning border-opacity-30">
                <i data-lucide="shield-check" class="w-8 h-8"></i>
            </div>
            <h3 class="fw-bold m-0 font-heading text-white">AuraDine AI</h3>
            <div class="text-secondary small mt-1">Executive Restaurant SaaS Portal</div>
        </div>

        <!-- DEMO CREDENTIAL AUTOFILL BADGE -->
        <div class="demo-credential-box mb-4 text-center" onclick="autofillAdmin()">
            <div class="small fw-bold text-success mb-1">⚡ Click to Autofill Admin Login</div>
            <div class="font-monospace text-secondary small">admin@aurabistro.com • password123</div>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm">
            <div class="mb-3">
                <label for="loginEmail" class="form-label small fw-semibold text-secondary">ADMIN EMAIL</label>
                <div class="position-relative">
                    <input type="email" id="loginEmail" class="form-control bg-dark text-white border-secondary border-opacity-30 ps-5 py-2.5 rounded-3" placeholder="admin@aurabistro.com" required value="admin@aurabistro.com">
                    <i data-lucide="mail" class="position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary" style="width: 18px;"></i>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="loginPassword" class="form-label small fw-semibold text-secondary mb-0">PASSWORD</label>
                    <a href="#" class="small text-warning text-decoration-none">Forgot?</a>
                </div>
                <div class="position-relative">
                    <input type="password" id="loginPassword" class="form-control bg-dark text-white border-secondary border-opacity-30 ps-5 py-2.5 rounded-3" placeholder="••••••••" required value="password123">
                    <i data-lucide="lock" class="position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary" style="width: 18px;"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-gold w-100 py-3 font-semibold rounded-3 mb-3">
                <i data-lucide="log-in"></i> Login to Executive Dashboard
            </button>
        </form>

        <div class="text-center">
            <a href="index.html" class="small text-secondary text-decoration-none">← Back to Customer Website</a>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();

        function autofillAdmin() {
            document.getElementById('loginEmail').value = 'admin@aurabistro.com';
            document.getElementById('loginPassword').value = 'password123';
        }
    </script>
</body>
</html>
